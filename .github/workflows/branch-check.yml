name: Validate customization branch
on:
  push:
    branches: [chatgpt/ui-customization-controls]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: python3 scripts/build.py
      - run: node scripts/examples.cjs
